[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "prideQC"
dynamic = ["version"]
description = "Streaming mass spectrometry QC and evidence-based technical SDRF annotation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "licenses/*", "NOTICE"]
dependencies = [
    "numpy>=1.26,<3",
    "pyopenms>=3.5,<4",
    "sdrf-pipelines>=0.1.6,<0.2",
    "pridepy>=0.0.16,<0.1",
]

[project.optional-dependencies]
ontology = ["sdrf-pipelines[ontology]>=0.1.6,<0.2"]

[project.scripts]
prideqc = "prideqc.cli:main"

[project.urls]
Homepage = "https://github.com/PRIDE-Archive/prideQC"
Repository = "https://github.com/PRIDE-Archive/prideQC"
Issues = "https://github.com/PRIDE-Archive/prideQC/issues"
Releases = "https://github.com/PRIDE-Archive/prideQC/releases"

[dependency-groups]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "jsonschema>=4.23,<5"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.2.0.dev0"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.hooks.vcs]
version-file = "src/prideqc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prideqc"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git*",
    "/.githooks",
    "/benchmarks",
    "/containers",
    "/scripts",
    "/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/prideqc"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyopenms.*", "sdrf_pipelines.*", "pridepy.*"]
ignore_missing_imports = true
