name: Python
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        dependencies: ['minimum', 'current']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - if: matrix.dependencies == 'minimum'
        run: uv pip install 'pyopenms==3.5.0' 'sdrf-pipelines==0.1.6' 'pridepy==0.0.16'
      - run: uv run --no-sync python -m unittest discover -s tests -v
        env:
          PRIDE_QC_REQUIRE_INTEGRATION: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: uv build
      - run: uv tree --no-dev
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy
  codon-host-python39:
    # Production loop and batch tools run on the Codon host python3 (3.9), outside the container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run --python 3.9 --no-project python -m unittest -v
          tests.test_nextflow_production_loop tests.test_nextflow_queue_to_manifest tests.test_nextflow_pride_inventory
          tests.test_nextflow_upload_qc_mongo tests.test_nextflow_qc_archive_stats
          tests.test_nextflow_qc_project_summary
