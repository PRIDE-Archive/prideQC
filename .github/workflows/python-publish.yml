name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest-known"

      - name: Build package
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from zipfile import ZipFile

          tag = os.environ["GITHUB_REF_NAME"]
          if re.fullmatch(r"v[0-9]+(?:\.[0-9]+){2}(?:[a-zA-Z0-9.-]+)?", tag) is None:
              raise SystemExit(f"release tag must use the v<version> form; got: {tag}")

          expected = tag.removeprefix("v")
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as archive:
              metadata = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata) != 1:
                  raise SystemExit(f"expected exactly one METADATA file, found {len(metadata)}")
              version_lines = [
                  line.removeprefix("Version: ").strip()
                  for line in archive.read(metadata[0]).decode("utf-8").splitlines()
                  if line.startswith("Version: ")
              ]

          if len(version_lines) != 1:
              raise SystemExit(f"expected exactly one Version field, found {len(version_lines)}")

          actual = version_lines[0]
          print(f"release_tag={tag}")
          print(f"expected_version={expected}")
          print(f"built_version={actual}")
          if actual != expected:
              raise SystemExit("built package version does not match release tag")
          PY

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: pypi
      url: https://pypi.org/project/prideQC/

    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v5
        with:
          name: python-release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
